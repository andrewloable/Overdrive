syntax = "proto3";

package bladewatch.v1;

option java_package = "net.bladewatch.app.grpc.v1";
option java_multiple_files = true;

// SystemService exposes daemon status, performance metrics, AI model management,
// and audio testing.
//
// HTTP mapping:
//   GetStatus          GET  /status
//   GetPerformance     GET  /api/performance     (PerformanceApiHandler)
//   PlayAudioTest      POST /api/audio/test-avas
//   ListModels         GET  /api/models/list
//   DownloadModel      POST /api/models/download
//   GetSohNominal      GET  /api/performance/soh/nominal
//   SetSohNominal      POST /api/performance/soh/nominal
//   GetSohStatus       GET  /api/performance/soh
//   ResetSoh           POST /api/performance/soh/reset
//   ResetPerformance   POST /api/performance/reset
//   GetParkingDelta    GET  /api/performance/parking-delta
//   GetLastCharge      GET  /api/performance/last-charge
//   GetSelectedModel   GET  /api/models/selected
//   SetSelectedModel   POST /api/models/selected
//   GetModelsManifest  GET  /api/models/manifest
service SystemService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetPerformance(GetPerformanceRequest) returns (GetPerformanceResponse);
  rpc PlayAudioTest(PlayAudioTestRequest) returns (PlayAudioTestResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc DownloadModel(DownloadModelRequest) returns (DownloadModelResponse);
  rpc GetSohNominal(GetSohNominalRequest) returns (GetSohNominalResponse);
  rpc SetSohNominal(SetSohNominalRequest) returns (SetSohNominalResponse);
  rpc GetSohStatus(GetSohStatusRequest) returns (GetSohStatusResponse);
  rpc ResetSoh(ResetSohRequest) returns (ResetSohResponse);
  rpc ResetPerformance(ResetPerformanceRequest) returns (ResetPerformanceResponse);
  rpc GetParkingDelta(GetParkingDeltaRequest) returns (GetParkingDeltaResponse);
  rpc GetLastCharge(GetLastChargeRequest) returns (GetLastChargeResponse);
  rpc GetSelectedModel(GetSelectedModelRequest) returns (GetSelectedModelResponse);
  rpc SetSelectedModel(SetSelectedModelRequest) returns (SetSelectedModelResponse);
  rpc GetModelsManifest(GetModelsManifestRequest) returns (GetModelsManifestResponse);
}

// BatteryInfo carries the Android battery level and charge state.
message BatteryInfo {
  int32 level = 1;
  // status (2), is_charging (3), status_string (4) removed: BatteryMonitor.getBatteryInfo() never
  // emits them and the only consumer (dashboard) reads battery.level. Charging state is delivered
  // separately via ChargingInfo (status.charging).
  reserved 2, 3, 4;
  reserved "status", "is_charging", "status_string";
}

// ChargingInfo carries BYD BMS charging power and state.
message ChargingInfo {
  string state_name = 1;
  string status = 2;
  double charging_power_k_w = 3;
  bool is_discharging = 4;
  bool is_error = 5;
  // True when kW is estimated from SoC rate rather than direct BMS reading.
  bool is_estimated = 6;
}

// SocInfo carries the high-voltage battery State of Charge.
message SocInfo {
  double percent = 1;
  bool is_low = 2;
  bool is_critical = 3;
  string status = 4;
}

// RangeInfo carries the vehicle's estimated driving range.
message RangeInfo {
  double elec_range_km = 1;
  double fuel_range_km = 2;
  double total_range_km = 3;
  bool is_low = 4;
  bool is_critical = 5;
  string status = 6;
  // Only present on PHEVs.
  double fuel_percent = 7;
}

// SohInfo carries the battery State of Health estimate.
message SohInfo {
  double percent = 1;
}

// RecordingStatus carries the current recording mode pipeline state.
message RecordingStatus {
  string configured_mode = 1;
  bool is_recording = 2;
  bool pipeline_running = 3;
  string gear = 4;
  bool acc_on = 5;
}

// TripStatus summarises the active trip analytics state.
message TripStatus {
  bool enabled = 1;
  bool trip_active = 2;
  // Epoch ms when the current trip started (0 when no trip active).
  int64 trip_start_time = 3;
  int64 trip_duration_sec = 4;
}

// NetworkInfo carries the current network connection details.
message NetworkInfo {
  string type = 1;
  string ssid = 2;
  string ip = 3;
  bool lan_http_enabled = 4;
  string http_bind = 5;
  string http_mode_warning = 6;
}

// GpsStatusInfo is a lightweight location snapshot embedded in SystemStatus.
// Full GpsLocation is in common.proto and is also used by VehicleService.
message GpsStatusInfo {
  double lat = 1;
  double lng = 2;
  double speed_kmh = 3;
  bool has_location = 4;
}

message GetStatusRequest {}

message GetStatusResponse {
  string device_id = 1;
  bool vehicle_data_ready = 2;
  string app_version = 3;
  // Camera IDs currently recording.
  repeated int32 recording = 4;
  // Camera IDs in view-only mode.
  repeated int32 viewing = 5;
  // Camera IDs active (recording or view).
  repeated int32 active = 6;
  // Camera IDs available on this device.
  repeated int32 available = 7;
  BatteryInfo battery = 8;
  bool acc = 9;
  ChargingInfo charging = 10;
  SocInfo soc = 11;
  RangeInfo range = 12;
  SohInfo soh = 13;
  string distance_unit = 14;
  string locale = 15;
  bool safe_zone_suppressed = 16;
  bool in_safe_zone = 17;
  string safe_zone_name = 18;
  bool gpu_surveillance = 19;
  RecordingStatus recording_status = 20;
  TripStatus trip_status = 21;
  // was gps_json (field 22): the /status REST payload emits a nested "gps" object
  // (GpsMonitor.getLocationJson()), never a "gpsJson" string, and no client consumes it from
  // /status. GPS is sourced from VehicleService.GetGpsLocation instead.
  reserved 22;
  reserved "gps_json";
  NetworkInfo network = 23;
  // Populated only when vehicle data block throws.
  string vehicle_data_error = 24;
}

message GetPerformanceRequest {}

message GetPerformanceResponse {
  bool success = 1;
  // Raw JSON blob from PerformanceApiHandler (format varies).
  string performance_json = 2;
}

message PlayAudioTestRequest {
  // Duration hint in milliseconds. 0 = use server default.
  int32 duration_ms = 1;
}

message PlayAudioTestResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}

// ModelInfo describes one downloadable AI model.
message ModelInfo {
  string name = 1;
  // url (2) removed: models are bundled in the APK (download is a stub); the list handler never
  // emits a url and no client consumes one.
  reserved 2;
  reserved "url";
  bool downloaded = 3;
  int64 size_bytes = 4;
}

message ListModelsRequest {}

message ListModelsResponse {
  // success (1) removed: the /api/models/list handler returns {models, default} with no success
  // field and no client consumes one.
  reserved 1;
  reserved "success";
  repeated ModelInfo models = 2;
}

message DownloadModelRequest {
  string url = 1;
  string name = 2;
}

message DownloadModelResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}

// SOH nominal capacity endpoints.
message GetSohNominalRequest {}
message GetSohNominalResponse {
  // Present only when a nominal kWh has been set; absent means "unset".
  optional double nominal_kwh = 1;
  // "user", "auto", or "unset".
  string nominal_source = 2;
}

message SetSohNominalRequest {
  // Omit (not set) to clear the user override.
  optional double nominal_kwh = 1;
}
message SetSohNominalResponse {
  bool success = 1;
  string error = 2;
}

// SOH status (stub — estimation has been removed).
message GetSohStatusRequest {}
message GetSohStatusResponse {
  bool success = 1;
  double nominal_capacity_kwh = 2;
  string nominal_source = 3;
  double display_soh = 4;
  string display_source = 5;
  string error = 6;
}

message ResetSohRequest {}
message ResetSohResponse {
  bool success = 1;
  string error = 2;
}

// Bulk performance data reset.
message ResetPerformanceRequest {
  // Categories to reset: "trips", "socHistory", "soh",
  // "mediaRecordings", "mediaSurveillance", "mediaProximity", "mediaTrips".
  repeated string categories = 1;
}
message ResetPerformanceResponse {
  bool success = 1;
  // Per-category result objects encoded as JSON (map serialisation complexity avoided).
  string results_json = 2;
  string error = 3;
}

// Parking energy-delta and last-charge endpoints.
message GetParkingDeltaRequest {
  // Hours of history to consider (default 72).
  int32 max_age_hours = 1;
}
message GetParkingDeltaResponse {
  bool available = 1;
  // Full JSON object from SocHistoryDatabase.getLastParkingDelta(), present when available=true.
  string raw_json = 2;
}

message GetLastChargeRequest {
  // How far back to look in hours (default 24).
  int32 hours_back = 1;
}
message GetLastChargeResponse {
  bool available = 1;
  // Full JSON object from SocHistoryDatabase.getMostRecentCompletedChargingSession(), present when available=true.
  string raw_json = 2;
}

// Vehicle model selection and manifest.
message GetSelectedModelRequest {}
message GetSelectedModelResponse {
  string model_id = 1;
  string color = 2;
}

message SetSelectedModelRequest {
  string model_id = 1;
  string color = 2;
}
message SetSelectedModelResponse {
  bool ok = 1;
  string error = 2;
}

message GetModelsManifestRequest {}
message GetModelsManifestResponse {
  // Full manifest JSON from /data/local/tmp/web/shared/models/manifest.json.
  string manifest_json = 1;
}
