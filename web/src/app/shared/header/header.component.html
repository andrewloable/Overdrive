<header class="app-header">
  <a routerLink="/" class="brand">BladeWatch</a>

  <div class="header-end">
    <button type="button" class="tunnel-pill" (click)="copyUrl()" [title]="'Copy ' + host()">
      <span class="dot"></span>
      <span class="url">{{ host() }}</span>
      <svg class="copy-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        @if (copied()) {
          <path d="M20 6L9 17l-5-5"/>
        } @else {
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        }
      </svg>
    </button>

    <a routerLink="/settings" class="lang-btn" aria-label="Language and settings" title="Language & settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </a>
  </div>
</header>
