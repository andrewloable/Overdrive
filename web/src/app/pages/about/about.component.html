<div class="page">
  <div class="page-header">
    <h1>About</h1>
  </div>

  @if (loading()) {
    <div class="loading">Loading…</div>
  } @else {
    <div class="card">
      <div class="info-row">
        <span class="info-label">App Version</span>
        <span class="info-value">{{ appVersion() || '—' }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Device ID</span>
        <span class="info-value mono">{{ deviceId() || '—' }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Platform</span>
        <span class="info-value">BYD DiLink v3 (Android 10+)</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">BladeWatch</div>
      <p class="about-text">Advanced sentry mode and dashcam system for BYD vehicles.</p>
      <p class="about-text">Your data stays on your device. No cloud required.</p>
    </div>
  }
</div>
