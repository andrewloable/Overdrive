<div class="login-container">
  <div class="login-card">
    <div class="brand-logo">
      <img src="/shared/app-icon-glyph-dark.webp" alt="BladeWatch">
    </div>
    <h1 class="login-title">BladeWatch</h1>
    <p class="login-subtitle">{{ 'login.subtitle' | translate }}</p>

    <div class="device-info">
      <div class="device-info-label">{{ 'login.device_id' | translate }}</div>
      <div class="device-info-value">{{ deviceId() }}</div>
    </div>

    @if (statusMessage()) {
      <div class="status-message" [class]="statusMessage()!.type">
        {{ statusMessage()!.text }}
      </div>
    }

    <div class="form-group">
      <label class="form-label">{{ 'login.access_code' | translate }}</label>
      <input
        type="text"
        class="form-input"
        [class.input-error]="error()"
        [ngModel]="accessCode()"
        (ngModelChange)="accessCode.set($event)"
        (keypress)="onKeyPress($event)"
        [placeholder]="'login.access_code_placeholder' | translate"
        autocomplete="off"
        spellcheck="false"
      >
      <p class="form-hint">{{ 'login.form_hint' | translate }}</p>
      @if (error()) {
        <p class="form-error">{{ error() }}</p>
      }
    </div>

    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner"></span>
      } @else {
        <span>{{ 'login.login' | translate }}</span>
      }
    </button>

    <div class="login-footer">
      <p>{{ 'login.footer' | translate }}</p>
    </div>
  </div>
</div>
